[project]
name = "pii-detection-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "psutil>=5.9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.9,<1",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
ner-benchmark = ["gliner", "gliner2", "spacy", "torch", "transformers"]
ocr = ["PyMuPDF>=1.24", "Pillow>=10", "pytesseract>=0.3.10"]
test-data = ["Faker>=24", "faker-ru-pii==0.1.0"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "python-docx>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
